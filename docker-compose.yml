version: "3.8"

services:
  # Postgres DB for voting app
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier

  # Redis for voting app
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - back-tier

  # Vote web app
  vote:
    build: ./vote
    ports:
      - "5080:80"
    environment:
      OPTION_A: "Cats"
      OPTION_B: "Dogs"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    networks:
      - front-tier
      - back-tier

  # Result web app
  result:
    build: ./result
    ports:
      - "5001:80"
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    networks:
      - front-tier
      - back-tier

  # Worker
  worker:
    build: ./worker
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    networks:
      - back-tier

networks:
  front-tier:
  back-tier:

volumes:
  db-data:
