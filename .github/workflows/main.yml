name: Voting App CI/CD Pipeline

# Trigger on push, pull request, or manual run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # ✅ enables manual trigger

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
      # ---------------------------------------------------------
      # 1️⃣ Checkout repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2️⃣ Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ---------------------------------------------------------
      # 3️⃣ Fix folder permissions
      # ---------------------------------------------------------
      - name: Fix Folder Permissions
        run: |
          chmod -R 777 result vote worker || true

      # ---------------------------------------------------------
      # 4️⃣ Install dependencies (Result App)
      # ---------------------------------------------------------
      - name: Install Dependencies (Result App)
        run: |
          cd result
          npm install

      # ---------------------------------------------------------
      # 5️⃣ Run tests
      # ---------------------------------------------------------
      - name: Run Tests
        run: |
          cd result
          npm test || echo "No tests defined, skipping..."

      # ---------------------------------------------------------
      # 6️⃣ SonarQube Scan
      # ---------------------------------------------------------
      - name: SonarQube Scan
        run: |
          docker run --rm \
            --network host \
            -e SONAR_HOST_URL="http://127.0.0.1:9000" \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -v $(pwd)/result:/usr/src:Z \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=voting-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # ---------------------------------------------------------
      # 7️⃣ Wait for SonarQube Quality Gate
      # ---------------------------------------------------------
      - name: Wait for SonarQube Quality Gate
        run: |
          echo "Waiting for SonarQube Quality Gate..."
          STATUS=""
          while [ "$STATUS" != "OK" ] && [ "$STATUS" != "FAILED" ]; do
            sleep 5
            STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
              "http://127.0.0.1:9000/api/qualitygates/project_status?projectKey=voting-app" \
              | jq -r '.projectStatus.status')
            echo "Current status: $STATUS"
          done
          if [ "$STATUS" != "OK" ]; then
            echo "❌ SonarQube Quality Gate failed!"
            exit 1
          fi
          echo "✅ Quality Gate passed! Continuing pipeline..."

      # ---------------------------------------------------------
      # 8️⃣ Build Docker Images
      # ---------------------------------------------------------
      - name: Build Docker Images
        run: |
          docker build -t 31793179/voting-app-vote:latest ./vote
          docker build -t 31793179/voting-app-result:latest ./result
          docker build -t 31793179/voting-app-worker:latest ./worker

      # ---------------------------------------------------------
      # 9️⃣ Trivy Vulnerability Scan + HTML Reports (FIXED)
      # ---------------------------------------------------------
      - name: Scan Docker Images with Trivy
        run: |
          mkdir -p trivy-reports

          # Download a proper HTML template from Trivy's GitHub
          curl -sL -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

          # Scan vote image with proper template
          trivy image --format template --template "./html.tpl" -o trivy-reports/vote.html 31793179/voting-app-vote:latest

          # Scan result image
          trivy image --format template --template "./html.tpl" -o trivy-reports/result.html 31793179/voting-app-result:latest

          # Scan worker image
          trivy image --format template --template "./html.tpl" -o trivy-reports/worker.html 31793179/voting-app-worker:latest

          echo "✅ Trivy HTML reports generated successfully!"
          ls -la trivy-reports/

      # ---------------------------------------------------------
      # 🔟 Upload Trivy HTML Reports as Artifacts
      # ---------------------------------------------------------
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/

      # ---------------------------------------------------------
      # 11️⃣ Login to DockerHub
      # ---------------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------------------------------------
      # 12️⃣ Push Docker Images
      # ---------------------------------------------------------
      - name: Push Docker Images
        run: |
          docker push 31793179/voting-app-vote:latest
          docker push 31793179/voting-app-result:latest
          docker push 31793179/voting-app-worker:latest
