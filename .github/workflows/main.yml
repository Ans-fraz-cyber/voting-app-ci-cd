name: Voting App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: self-hosted  # ✅ Your Fedora self-hosted GitHub runner

    steps:
      # ---------------------------------------------------------
      # 1️⃣ Checkout your repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2️⃣ Setup Node.js environment
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ---------------------------------------------------------
      # 3️⃣ Fix folder permissions (important for Fedora + Docker)
      # ---------------------------------------------------------
      - name: Fix Folder Permissions
        run: |
          chmod -R 777 result vote worker || true

      # ---------------------------------------------------------
      # 4️⃣ Install dependencies (Result app)
      # ---------------------------------------------------------
      - name: Install Dependencies (Result App)
        run: |
          cd result
          npm install

      # ---------------------------------------------------------
      # 5️⃣ Run tests (skip gracefully if none exist)
      # ---------------------------------------------------------
      - name: Run Tests
        run: |
          cd result
          npm test || echo "No tests defined, skipping..."

      # ---------------------------------------------------------
      # 6️⃣ SonarQube Static Code Analysis via Docker
      # ---------------------------------------------------------
      - name: SonarQube Scan (via Docker)
        run: |
          docker run --rm \
            --network host \
            -e SONAR_HOST_URL="http://127.0.0.1:9000" \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -v $(pwd)/result:/usr/src:Z \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=voting-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # ---------------------------------------------------------
      # 7️⃣ Build Docker Images for each microservice
      # ---------------------------------------------------------
      - name: Build Docker Images
        run: |
          docker build -t 31793179/voting-app-vote:latest ./vote
          docker build -t 31793179/voting-app-result:latest ./result
          docker build -t 31793179/voting-app-worker:latest ./worker

      # ---------------------------------------------------------
      # 8️⃣ Login to DockerHub using GitHub Secrets
      # ---------------------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------------------------------------
      # 9️⃣ Push the built Docker images to DockerHub
      # ---------------------------------------------------------
      - name: Push Docker Images
        run: |
          docker push 31793179/voting-app-vote:latest
          docker push 31793179/voting-app-result:latest
          docker push 31793179/voting-app-worker:latest
