name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ----------------------------
  # 1️⃣ SonarQube Code Analysis
  # ----------------------------
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'      # Required input
          java-version: '17'

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=voting-app-ci-cd
            -Dsonar.projectName="Voting App CI/CD"
            -Dsonar.host.url=http://192.168.18.63:9000
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ----------------------------
  # 2️⃣ Build & Push Docker Images
  # ----------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: sonar-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Vote Image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          file: ./vote/Dockerfile
          push: true
          tags: 31793179/voting-app-vote:latest

      - name: Build & Push Result Image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          file: ./result/Dockerfile
          push: true
          tags: 31793179/voting-app-result:latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: 31793179/voting-app-worker:latest

  # ----------------------------
  # 3️⃣ Deploy Application
  # ----------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Images
        run: |
          docker pull 31793179/voting-app-vote:latest
          docker pull 31793179/voting-app-result:latest
          docker pull 31793179/voting-app-worker:latest

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --remove-orphans
