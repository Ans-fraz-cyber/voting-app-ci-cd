name: Voting App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies (Result App)
        run: |
          cd result
          npm install

      - name: Run Tests
        run: |
          cd result
          npm test || echo "No tests defined, skipping..."

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"
        with:
          projectBaseDir: result

      - name: Build Docker Images
        run: |
          docker build -t 31793179/voting-app-vote:latest ./vote
          docker build -t 31793179/voting-app-result:latest ./result
          docker build -t 31793179/voting-app-worker:latest ./worker

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push 31793179/voting-app-vote:latest
          docker push 31793179/voting-app-result:latest
          docker push 31793179/voting-app-worker:latest
