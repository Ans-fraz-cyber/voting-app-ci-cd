name: Voting App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fix Folder Permissions
        run: |
          chmod -R 777 result vote worker || true

      - name: Install Dependencies (Result App)
        run: |
          cd result
          npm install

      - name: Run Tests
        run: |
          cd result
          npm test || echo "No tests defined, skipping..."

      - name: SonarQube Scan
        run: |
          echo "🔍 Starting SonarQube Scan..."
          docker run --rm \
            --network host \
            -e SONAR_HOST_URL="http://127.0.0.1:9000" \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -v $(pwd)/result:/usr/src:Z \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=voting-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarQube Quality Gate
        run: |
          echo "⏳ Waiting for SonarQube Quality Gate..."
          max_attempts=12
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            response=$(curl -s -w "%{http_code}" -u ${{ secrets.SONAR_TOKEN }}: \
              "http://127.0.0.1:9000/api/qualitygates/project_status?projectKey=voting-app") || true
            
            status_code="${response: -3}"
            json_response="${response%???}"
            
            if [ "$status_code" = "200" ]; then
              STATUS=$(echo "$json_response" | jq -r '.projectStatus.status  // "UNKNOWN"')
              echo "Quality Gate Status: $STATUS"
              
              if [ "$STATUS" = "OK" ]; then
                echo "✅ Quality Gate PASSED!"
                exit 0
              elif [ "$STATUS" = "ERROR" ]; then
                echo "❌ Quality Gate FAILED!"
                exit 1
              fi
            else
              echo "⚠️ SonarQube API returned HTTP $status_code, retrying..."
            fi
            
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "❌ SonarQube Quality Gate check timeout after $max_attempts attempts"
          exit 1

      - name: Build Docker Images
        run: |
          docker build -t 31793179/voting-app-vote:latest ./vote
          docker build -t 31793179/voting-app-result:latest ./result
          docker build -t 31793179/voting-app-worker:latest ./worker

      - name: Generate Trivy HTML Reports
        run: |
          python3 generate_trivy_report.py

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push 31793179/voting-app-vote:latest
          docker push 31793179/voting-app-result:latest
          docker push 31793179/voting-app-worker:latest

      - name: Deploy Application
        run: |
          echo "🚀 Starting Auto-Deployment..."
          
          # Stop any old containers
          docker stop voting-app-vote-1 voting-app-result-1 voting-app-worker-1 voting-app-db-1 voting-app-redis-1 2>/dev/null || true
          docker rm voting-app-vote-1 voting-app-result-1 voting-app-worker-1 voting-app-db-1 voting-app-redis-1 2>/dev/null || true
          
          # Pull latest images
          docker pull 31793179/voting-app-vote:latest
          docker pull 31793179/voting-app-result:latest
          docker pull 31793179/voting-app-worker:latest
          
          # Deploy
          docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          docker-compose -f docker-compose.prod.yml up -d
          
          # Wait and verify
          sleep 20
          echo "📊 Deployed Services:"
          docker-compose -f docker-compose.prod.yml ps
          
          # Test accessibility
          echo "🔍 Testing applications..."
          timeout 10s bash -c 'until curl -f http://localhost:5080; do sleep 2; done' && echo "✅ Vote app accessible" || echo "⚠️ Vote app starting..."
          timeout 10s bash -c 'until curl -f http://localhost:5001; do sleep 2; done' && echo "✅ Result app accessible" || echo "⚠️ Result app starting..."
          
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "🌐 Vote App: http://$PUBLIC_IP:5080"
          echo "📊 Result App: http://$PUBLIC_IP:5001"
          echo "🔍 SonarQube: http://$PUBLIC_IP:9000"
