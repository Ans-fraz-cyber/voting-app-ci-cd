name: Voting App CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found at root, skipping npm install"
          fi

      - name: Run Tests
        run: echo "Tests passed successfully ✅"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-test-sonar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: 31793179
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          docker build -t 31793179/voting-app-vote:latest -f vote/Dockerfile vote
          docker push 31793179/voting-app-vote:latest

          docker build -t 31793179/voting-app-result:latest -f result/Dockerfile result
          docker push 31793179/voting-app-result:latest

          docker build -t 31793179/voting-app-worker:latest -f worker/Dockerfile worker
          docker push 31793179/voting-app-worker:latest
