name: Voting App CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  IMAGE_VERSION: latest

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=voting-app-ci-cd
            -Dsonar.organization=ans-fraz-cyber
            -Dsonar.host.url=http://localhost:9000
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Images
        run: |
          docker build -t $DOCKER_USERNAME/voting-app-vote:$IMAGE_VERSION ./vote
          docker build -t $DOCKER_USERNAME/voting-app-result:$IMAGE_VERSION ./result
          docker build -t $DOCKER_USERNAME/voting-app-worker:$IMAGE_VERSION ./worker

      - name: Push Docker Images to DockerHub
        run: |
          docker push $DOCKER_USERNAME/voting-app-vote:$IMAGE_VERSION
          docker push $DOCKER_USERNAME/voting-app-result:$IMAGE_VERSION
          docker push $DOCKER_USERNAME/voting-app-worker:$IMAGE_VERSION

      - name: Logout Docker
        run: docker logout
